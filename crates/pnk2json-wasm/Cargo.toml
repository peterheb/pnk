[package]
name = "pnk2json-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper: iWork document bytes -> pnk JSON string"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
pnk2json = { path = "../pnk2json" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
