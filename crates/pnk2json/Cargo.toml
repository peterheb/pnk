[package]
name = "pnk2json"
version = "0.2.0"
edition = "2021"
description = "iWork '13+ document -> pnk JSON model converter (lib + CLI), with text/markdown fallback dumpers"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
plist = "1"
iwadump = { path = "../iwadump" }

[lib]
name = "pnk2json"
path = "src/lib.rs"

[[bin]]
name = "pnk2json"
path = "src/bin/pnk2json.rs"
