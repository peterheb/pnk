[package]
name = "iwadump"
version = "0.1.0"
edition = "2021"
description = "iWork '13+ file structure inspector: ZIP container -> snappy blocks -> TSP archives"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lib]
name = "iwadump"
path = "src/lib.rs"

[[bin]]
name = "iwadump"
path = "src/main.rs"
